---
type: "RectangularWorld"
size:  [8, 8]
time_step: !np 1 / 40  # 0.025 seconds
seed: <{ seed|default(2023) }>

agents:
  - type: "MazeAgent"
    position: [4, 3]
    agent_radius: 0.1

  - type: "MazeAgent"
    position: [4.5, 3]
    agent_radius: 0.1
    controller:
      type: HumanController
      joystick: ~

# spawners:
#   - type: UniformAgentSpawner
#     n: 8  # default number of agents BUT may be overridden by user args
#     facing: away
#     region: [[3.4, 3.4], [3.4, 4.6], [4.6, 4.6], [4.6, 3.4]]
#     agent: !include turbopi.yaml
metrics:
  - type: MovingMass
    history_size: 225
    linear: [1, 1]
  - type: Boids
    linear: [1, 1, 3]
    separation_metric:
      history_size: 450
      # 0.2 - distance between the centers of two agent centers
      # +0.05 - a bit more padding
      linear: [[0.2, !np "0.2+0.1", !np "0.2+2*0.1"], [-1, 0, 1]]
      clamp: [-1, 1]
    cohesion_metric:
      history_size: 450
      linear: [[0.9, 1., 1.1], [1, 0, -1]]
      clamp: [-1, 1]
    alignment_metric:
      history_size: 450
      pre_exponent: 1
      post_exponent: 2
